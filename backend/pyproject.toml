[project]
name = "coach-backend"
version = "0.1.0"
description = "AI Communication Coach backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.104.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.29",
    "supabase>=2.30.0",
    "pydantic>=2.13.4",
    "openai>=2.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
